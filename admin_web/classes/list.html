<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Lớp Học - EduFace LMS Admin</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS v3 Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#0068ff', 600: '#0054d1', 700: '#0043a8' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
    </style>
</head>
<body data-nav="classes" class="min-h-screen flex flex-col bg-[#f8fafc] text-slate-800">

    <!-- REUSABLE HEADER -->
    <div id="admin-header"></div>

    <div class="flex-1 flex min-h-[calc(100vh-65px)]">
        <!-- REUSABLE SIDEBAR -->
        <div id="admin-sidebar"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto max-w-7xl mx-auto w-full">
            <!-- Header & Action -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                <div>
                    <div class="flex items-center space-x-2 text-xs text-slate-500 mb-1">
                        <a href="../index.html" class="hover:text-blue-600 transition">Dashboard</a>
                        <span>/</span>
                        <span class="text-slate-700 font-medium">Lớp học</span>
                    </div>
                    <h1 class="text-2xl font-black text-slate-800 tracking-tight">Quản Lý Lớp Học</h1>
                    <p class="text-xs text-slate-500 mt-1">Danh sách lớp sinh hoạt, phân bổ niên khóa, khoa đào tạo và giáo viên chủ nhiệm</p>
                </div>
                <div class="flex items-center space-x-3">
                    <a href="create.html"
                        class="inline-flex items-center px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold shadow-sm transition space-x-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        <span>Thêm Lớp Mới</span>
                    </a>
                </div>
            </div>

            <!-- Filters Bar -->
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm mb-6 flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4">
                <div class="flex-1 flex flex-col sm:flex-row items-center gap-3">
                    <div class="relative w-full sm:w-80">
                        <input type="text" id="classSearchInput" placeholder="Tìm theo tên hoặc mã lớp..."
                            oninput="filterClasses()"
                            class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl pl-9 pr-3 py-2 text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>

                    <!-- Faculty Filter -->
                    <div class="w-full sm:w-56">
                        <select id="facultyFilterSelect" onchange="filterClasses()"
                            class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition font-medium">
                            <option value="ALL">Tất cả khoa</option>
                        </select>
                    </div>

                    <!-- Academic Year Filter -->
                    <div class="w-full sm:w-44">
                        <select id="yearFilterSelect" onchange="filterClasses()"
                            class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition font-medium">
                            <option value="ALL">Tất cả niên khóa</option>
                            <option value="2022-2026">2022-2026</option>
                            <option value="2023-2027">2023-2027</option>
                            <option value="2024-2028">2024-2028</option>
                            <option value="2025-2029">2025-2029</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center space-x-2 text-xs text-slate-500 shrink-0">
                    <span>Tổng số:</span>
                    <span id="filteredClassesCount" class="font-bold text-slate-800">0</span>
                    <span>lớp học</span>
                </div>
            </div>

            <!-- Classes Table -->
            <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-50 text-slate-600 uppercase text-[11px] font-bold border-b border-slate-200 tracking-wider">
                            <tr>
                                <th class="p-3.5 pl-6 whitespace-nowrap">Mã Lớp</th>
                                <th class="p-3.5 whitespace-nowrap">Tên Lớp Học</th>
                                <th class="p-3.5 whitespace-nowrap">Khoa Trực Thuộc</th>
                                <th class="p-3.5 whitespace-nowrap">Niên Khóa</th>
                                <th class="p-3.5 whitespace-nowrap">GV Chủ Nhiệm</th>
                                <th class="p-3.5 whitespace-nowrap">Sĩ Số</th>
                                <th class="p-3.5 pr-6 text-right whitespace-nowrap">Hành Động</th>
                            </tr>
                        </thead>
                        <tbody id="classesTableBody" class="divide-y divide-slate-100">
                            <tr>
                                <td colspan="7" class="py-16 text-center text-slate-400">
                                    <svg class="w-8 h-8 mx-auto animate-spin text-blue-500 mb-3" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                                    </svg>
                                    <p>Đang tải danh sách lớp học...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/admin-components.js"></script>
    <script>
        let allClasses = [];
        let allFaculties = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadFacultiesAndClasses();
        });

        async function loadFacultiesAndClasses() {
            try {
                // Fetch faculties for filter
                const fRes = await fetch(`${API_BASE}/api/admin/faculties`);
                if (fRes.ok) {
                    const fResult = await fRes.json();
                    allFaculties = fResult.data || [];
                    populateFacultyFilter();
                }

                // Fetch classes
                const cRes = await fetch(`${API_BASE}/api/admin/classes`);
                if (cRes.ok) {
                    const cResult = await cRes.json();
                    allClasses = cResult.data || [];
                    renderClasses(allClasses);
                } else {
                    document.getElementById('classesTableBody').innerHTML = `
                        <tr><td colspan="7" class="py-12 text-center text-red-500 font-semibold">Lỗi tải dữ liệu lớp (HTTP ${cRes.status}).</td></tr>
                    `;
                }
            } catch (e) {
                console.error(e);
                document.getElementById('classesTableBody').innerHTML = `
                    <tr><td colspan="7" class="py-12 text-center text-red-500 font-semibold">Lỗi kết nối máy chủ.</td></tr>
                `;
            }
        }

        function populateFacultyFilter() {
            const sel = document.getElementById('facultyFilterSelect');
            sel.innerHTML = '<option value="ALL">Tất cả khoa</option>';
            allFaculties.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.id;
                opt.textContent = `${f.facultyCode} - ${f.facultyName}`;
                sel.appendChild(opt);
            });
        }

        function filterClasses() {
            const q = (document.getElementById('classSearchInput').value || '').toLowerCase().trim();
            const facultyId = document.getElementById('facultyFilterSelect').value;
            const year = document.getElementById('yearFilterSelect').value;

            const filtered = allClasses.filter(c => {
                const matchQ = !q ||
                    (c.className && c.className.toLowerCase().includes(q)) ||
                    (c.classCode && c.classCode.toLowerCase().includes(q));

                let matchFaculty = true;
                if (facultyId !== 'ALL') {
                    matchFaculty = String(c.facultyId) === String(facultyId);
                }

                let matchYear = true;
                if (year !== 'ALL') {
                    matchYear = c.academicYear === year;
                }

                return matchQ && matchFaculty && matchYear;
            });

            renderClasses(filtered);
        }

        function renderClasses(classes) {
            const tbody = document.getElementById('classesTableBody');
            document.getElementById('filteredClassesCount').textContent = classes.length;

            if (classes.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="py-16 text-center text-slate-400">
                            <p class="font-bold text-slate-700 text-sm">Không tìm thấy lớp học phù hợp</p>
                            <p class="text-xs mt-1">Vui lòng điều chỉnh tiêu chí lọc.</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = classes.map(c => {
                return `
                    <tr class="hover:bg-slate-50/80 transition group">
                        <td class="p-3.5 pl-6 whitespace-nowrap">
                            <span class="font-mono font-bold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-lg text-xs border border-blue-200">
                                ${escapeHtml(c.classCode)}
                            </span>
                        </td>
                        <td class="p-3.5 whitespace-nowrap font-bold text-slate-800 text-sm group-hover:text-blue-600 transition">
                            ${escapeHtml(c.className)}
                        </td>
                        <td class="p-3.5 whitespace-nowrap">
                            <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-[11px] font-semibold">
                                ${escapeHtml(c.facultyName || 'Khoa Đào tạo')}
                            </span>
                        </td>
                        <td class="p-3.5 whitespace-nowrap font-mono text-slate-600 text-xs">
                            ${escapeHtml(c.academicYear || '--')}
                        </td>
                        <td class="p-3.5 whitespace-nowrap text-slate-700">
                            ${escapeHtml(c.homeroomTeacher || 'Chưa phân công')}
                        </td>
                        <td class="p-3.5 whitespace-nowrap">
                            <a href="details.html?id=${c.id}" class="group/std inline-flex items-center space-x-1 hover:text-blue-600 transition" title="Bấm để xem & quản lý sinh viên">
                                <span class="font-bold text-slate-800 group-hover/std:text-blue-600">${c.totalStudents || 0}</span>
                                <span class="text-slate-400 text-[11px]"> SV</span>
                                <svg class="w-3.5 h-3.5 text-slate-400 group-hover/std:text-blue-600 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                            </a>
                        </td>
                        <td class="p-3.5 pr-6 text-right whitespace-nowrap">
                            <div class="flex items-center justify-end space-x-1.5">
                                <a href="details.html?id=${c.id}"
                                    class="px-2.5 py-1 rounded-lg border border-blue-200 bg-blue-50/80 hover:bg-blue-100 text-blue-700 font-semibold transition flex items-center space-x-1" title="Quản lý sinh viên trong lớp">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                                    </svg>
                                    <span>Quản lý SV</span>
                                </a>
                                <a href="edit.html?id=${c.id}"
                                    class="px-2.5 py-1 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 text-slate-700 font-semibold transition" title="Chỉnh sửa lớp">
                                    Sửa
                                </a>
                                <a href="delete.html?id=${c.id}"
                                    class="px-2.5 py-1 rounded-lg border border-red-200 bg-white hover:bg-red-50 text-red-600 font-semibold transition" title="Xóa lớp">
                                    Xóa
                                </a>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }
    </script>
</body>
</html>
