<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh Sửa Tài Khoản / Sinh Viên - LMS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

    <main class="max-w-[1440px] mx-auto px-4 sm:px-7 py-6">
        <div class="max-w-3xl mx-auto bg-slate-900 border border-slate-800 rounded-lg shadow-sm overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-slate-800 flex items-center justify-between gap-3">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-slate-100" id="pageHeading">Chỉnh Sửa Tài Khoản</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Cập nhật hồ sơ thông tin và trạng thái phân quyền</p>
                </div>
                <a href="list.html" class="inline-flex items-center px-3 py-1.5 rounded text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                    Quay lại danh sách
                </a>
            </div>

            <div class="p-4 sm:p-6">
                <form id="editStudentForm" onsubmit="handleFormSubmit(event)">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Tên đăng nhập (Cố định)</label>
                            <input type="text" id="username" class="form-input opacity-70 cursor-not-allowed" disabled>
                            <span class="text-[11px] text-slate-400">Mã định danh hệ thống không được thay đổi</span>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Đổi mật khẩu mới</label>
                            <input type="password" id="password" class="form-input">
                            <span class="text-[11px] text-slate-400">Để trống nếu không muốn đổi mật khẩu</span>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Họ và tên đầy đủ</label>
                            <input type="text" id="fullName" class="form-input" required>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Địa chỉ Email</label>
                            <input type="email" id="email" class="form-input" required>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Phân quyền vai trò</label>
                            <select id="role" class="form-select" onchange="handleRoleChange(this.value)">
                                <option value="STUDENT">Sinh viên (STUDENT)</option>
                                <option value="INSTRUCTOR">Giảng viên (INSTRUCTOR)</option>
                                <option value="ADMIN">Quản trị viên (ADMIN)</option>
                            </select>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Trạng thái kích hoạt</label>
                            <select id="status" class="form-select">
                                <option value="ACTIVE">Hoạt động bình thường</option>
                                <option value="LOCKED">Tạm khóa tài khoản</option>
                            </select>
                        </div>

                        <div class="flex flex-col gap-1.5" id="studentCodeGroup">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Mã số sinh viên (MSSV)</label>
                            <input type="text" id="studentCode" class="form-input">
                        </div>

                        <div class="flex flex-col gap-1.5" id="classCodeGroup">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Mã lớp sinh hoạt</label>
                            <input type="text" id="classCode" class="form-input">
                        </div>

                        <div class="flex flex-col gap-1.5 md:col-span-2">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Trạng thái đăng ký Face AI</label>
                            <select id="faceEnrolled" class="form-select">
                                <option value="true">Đã nạp vector nhận diện khuôn mặt</option>
                                <option value="false">Chưa đăng ký (Yêu cầu sinh viên quét 3 góc mặt lần đầu)</option>
                            </select>
                            <span class="text-[11px] text-slate-400">Nếu chọn 'Chưa đăng ký', hệ thống bắt buộc sinh viên quét mặt khi đăng nhập</span>
                        </div>
                    </div>

                    <div class="mt-6 pt-5 border-t border-slate-800 flex items-center justify-end gap-3">
                        <a href="list.html" class="inline-flex items-center px-4 py-2 rounded text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                            Hủy bỏ
                        </a>
                        <button type="submit" class="inline-flex items-center px-4 py-2 rounded text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white transition shadow-sm">
                            Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../assets/js/store.js"></script>
    <script>
        let currentUserId = null;

        document.addEventListener("DOMContentLoaded", () => {
            currentUserId = parseInt(getQueryParam('id'), 10);
            if (!currentUserId) {
                alert("Thiếu tham số mã người dùng cần sửa!");
                window.location.href = "list.html";
                return;
            }

            renderMasterLayout('students', [
                { label: 'Quản lý Sinh viên & Tài khoản', url: 'list.html' },
                { label: 'Chỉnh sửa' }
            ]);

            loadUserData();
        });

        function handleRoleChange(role) {
            const isStudent = role === 'STUDENT';
            document.getElementById('studentCodeGroup').style.display = isStudent ? 'flex' : 'none';
            document.getElementById('classCodeGroup').style.display = isStudent ? 'flex' : 'none';
        }

        function loadUserData() {
            const store = Store.get();
            const u = store.users.find(x => x.id === currentUserId);
            if (!u) {
                alert("Không tìm thấy người dùng có mã ID: " + currentUserId);
                window.location.href = "list.html";
                return;
            }

            document.getElementById("pageHeading").innerText = "Chỉnh Sửa Tài Khoản: " + u.username;
            document.getElementById("username").value = u.username;
            document.getElementById("fullName").value = u.fullName;
            document.getElementById("email").value = u.email;
            document.getElementById("role").value = u.role;
            document.getElementById("status").value = u.status;
            document.getElementById("studentCode").value = u.studentCode === '-' ? '' : u.studentCode;
            document.getElementById("classCode").value = u.classCode === '-' ? '' : u.classCode;
            document.getElementById("faceEnrolled").value = u.faceEnrolled ? "true" : "false";

            handleRoleChange(u.role);
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const store = Store.get();
            const u = store.users.find(x => x.id === currentUserId);
            if (!u) return;

            u.fullName = document.getElementById("fullName").value.trim();
            u.email = document.getElementById("email").value.trim();
            u.role = document.getElementById("role").value;
            u.status = document.getElementById("status").value;
            u.studentCode = u.role === 'STUDENT' ? (document.getElementById("studentCode").value.trim() || "-") : "-";
            u.classCode = u.role === 'STUDENT' ? (document.getElementById("classCode").value.trim() || "-") : "-";
            u.faceEnrolled = document.getElementById("faceEnrolled").value === "true";

            Store.save(store);
            alert("Đã cập nhật thông tin thành công!");
            window.location.href = "details.html?id=" + currentUserId;
        }
    </script>
</body>
</html>
