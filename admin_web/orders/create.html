<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khởi Tạo Đơn Hàng Mua Khóa Học - LMS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

    <main class="max-w-[1440px] mx-auto px-4 sm:px-7 py-6">
        <div class="max-w-3xl mx-auto bg-slate-900 border border-slate-800 rounded-lg shadow-sm overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-slate-800 flex items-center justify-between gap-3">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-slate-100">Tạo Đơn Hàng &amp; Phát Mã Thanh Toán VietQR</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Giả lập đăng ký mua khóa học và liên kết mã giao dịch ngân hàng PayOS</p>
                </div>
                <a href="list.html" class="inline-flex items-center px-3 py-1.5 rounded text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                    Quay lại danh sách
                </a>
            </div>

            <div class="p-4 sm:p-6">
                <form id="createOrderForm" onsubmit="handleFormSubmit(event)">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Chọn sinh viên đăng ký học</label>
                            <select id="studentSelect" class="form-select" required>
                                <!-- Populated dynamically -->
                            </select>
                            <span class="text-[11px] text-slate-400">Danh sách các tài khoản sinh viên</span>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Chọn khóa học cần mua</label>
                            <select id="courseSelect" class="form-select" onchange="updatePricePreview()" required>
                                <!-- Populated dynamically -->
                            </select>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Số tiền học phí thanh toán (VND)</label>
                            <input type="text" id="priceDisplay" class="form-input opacity-80 cursor-not-allowed" readonly>
                            <span class="text-[11px] text-slate-400">Số tiền chính xác chuyển khoản qua mã QR</span>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Cổng thanh toán tự động</label>
                            <select id="gateway" class="form-select">
                                <option value="PAYOS">PayOS VietQR (Quét mã App Ngân hàng 24/7)</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-6 pt-5 border-t border-slate-800 flex items-center justify-end gap-3">
                        <a href="list.html" class="inline-flex items-center px-4 py-2 rounded text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                            Hủy bỏ
                        </a>
                        <button type="submit" class="inline-flex items-center px-4 py-2 rounded text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white transition shadow-sm">
                            Xác nhận tạo đơn và sinh mã QR
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../assets/js/store.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderMasterLayout('orders', [
                { label: 'Đơn hàng & PayOS', url: 'list.html' },
                { label: 'Tạo đơn mới' }
            ]);

            populateDropdowns();
        });

        function populateDropdowns() {
            const store = Store.get();
            const studentSelect = document.getElementById("studentSelect");
            studentSelect.innerHTML = "";
            const students = store.users.filter(u => u.role === 'STUDENT');
            students.forEach(s => {
                studentSelect.innerHTML += `<option value="${escapeHtml(s.fullName)}">${escapeHtml(s.fullName)} (${escapeHtml(s.studentCode || s.username)})</option>`;
            });

            const courseSelect = document.getElementById("courseSelect");
            courseSelect.innerHTML = "";
            store.courses.forEach(c => {
                courseSelect.innerHTML += `<option value="${c.id}" data-price="${c.price}">${escapeHtml(c.title)} (${c.price.toLocaleString("vi-VN")} VND)</option>`;
            });

            updatePricePreview();
        }

        function updatePricePreview() {
            const courseSelect = document.getElementById("courseSelect");
            const opt = courseSelect.options[courseSelect.selectedIndex];
            if (opt) {
                const price = parseInt(opt.getAttribute("data-price"), 10) || 0;
                document.getElementById("priceDisplay").value = price.toLocaleString("vi-VN") + " VND";
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const store = Store.get();
            const studentName = document.getElementById("studentSelect").value;
            const courseSelect = document.getElementById("courseSelect");
            const opt = courseSelect.options[courseSelect.selectedIndex];
            const courseTitle = opt.text.split(" (")[0];
            const price = parseInt(opt.getAttribute("data-price"), 10) || 0;

            const newId = store.orders.length ? Math.max(...store.orders.map(o => o.id)) + 1 : 1001;
            const now = new Date();
            const timeStr = String(now.getDate()).padStart(2,'0') + "/" + String(now.getMonth()+1).padStart(2,'0') + "/" + now.getFullYear() + " " + String(now.getHours()).padStart(2,'0') + ":" + String(now.getMinutes()).padStart(2,'0');

            store.orders.unshift({
                id: newId,
                studentName: studentName,
                course: courseTitle,
                amount: price,
                status: "PENDING",
                vietQrTx: "VCB-" + Math.floor(10000000 + Math.random() * 90000000),
                createdAt: timeStr
            });

            Store.save(store);
            alert("Đã tạo đơn hàng thành công!");
            window.location.href = "details.html?id=" + newId;
        }
    </script>
</body>
</html>
