<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Khóa Học - EduFace LMS Admin</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS v3 Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 500: '#0068ff', 600: '#0054d1', 700: '#0043a8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
    </style>
</head>
<body data-nav="courses" class="min-h-screen flex flex-col bg-[#f8fafc] text-slate-800">

    <!-- REUSABLE HEADER INJECTED BY admin-components.js -->
    <div id="admin-header"></div>

    <div class="flex-1 flex min-h-[calc(100vh-65px)]">
        <!-- REUSABLE SIDEBAR INJECTED BY admin-components.js -->
        <div id="admin-sidebar"></div>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 p-6 lg:p-8 overflow-y-auto max-w-7xl mx-auto w-full">
            <!-- Breadcrumbs & Header -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                <div>
                    <div class="flex items-center space-x-2 text-xs text-slate-500 mb-1">
                        <a href="../index.html" class="hover:text-blue-600 transition">Dashboard</a>
                        <span>/</span>
                        <span class="text-slate-700 font-medium">Khóa học</span>
                    </div>
                    <h1 class="text-2xl font-black text-slate-800 tracking-tight">Danh Sách Khóa Học</h1>
                    <p class="text-xs text-slate-500 mt-1">Quản lý chương trình đào tạo, môn học và phân bổ theo từng chuyên ngành</p>
                </div>
                <div class="flex items-center space-x-3">
                    <a href="create.html"
                        class="inline-flex items-center px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold shadow-sm transition space-x-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        <span>Thêm Khóa Học Mới</span>
                    </a>
                </div>
            </div>

            <!-- Filter Bar -->
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm mb-6 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
                <div class="flex-1 flex flex-col sm:flex-row items-center gap-3">
                    <div class="relative w-full sm:w-80">
                        <input type="text" id="courseSearchInput" placeholder="Tìm theo tên hoặc mã khóa học..."
                            oninput="filterCourses()"
                            class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl pl-9 pr-3 py-2 text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
                        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>

                    <!-- Major Filter Dropdown -->
                    <div class="w-full sm:w-64">
                        <select id="majorFilterSelect" onchange="filterCourses()"
                            class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition font-medium">
                            <option value="ALL">Tất cả chuyên ngành</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center space-x-2 text-xs text-slate-500 shrink-0">
                    <span>Hiển thị:</span>
                    <span id="filteredCoursesCount" class="font-bold text-slate-800">0</span>
                    <span>khóa học</span>
                </div>
            </div>

            <!-- Courses Grid List -->
            <div id="coursesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Loading State -->
                <div class="col-span-full py-16 text-center text-slate-400">
                    <svg class="w-8 h-8 mx-auto animate-spin text-blue-500 mb-3" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    <p class="text-xs">Đang tải danh sách khóa học...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/admin-components.js"></script>
    <script>
        let allCourses = [];
        let allMajors = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadMajorsAndCourses();
        });

        async function loadMajorsAndCourses() {
            try {
                // Fetch majors for filter dropdown
                const mRes = await fetch(`${API_BASE}/api/admin/majors`);
                if (mRes.ok) {
                    const mResult = await mRes.json();
                    allMajors = mResult.data || [];
                    populateMajorFilter();
                }

                // Fetch courses
                const cRes = await fetch(`${API_BASE}/api/admin/courses`);
                if (cRes.ok) {
                    const cResult = await cRes.json();
                    allCourses = cResult.data || [];
                    renderCourses(allCourses);
                } else {
                    document.getElementById('coursesContainer').innerHTML = `
                        <div class="col-span-full py-12 text-center text-red-500 text-xs">
                            Không thể tải danh sách khóa học (HTTP ${cRes.status}).
                        </div>
                    `;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('coursesContainer').innerHTML = `
                    <div class="col-span-full py-12 text-center text-red-500 text-xs">
                        Lỗi kết nối máy chủ khi nạp khóa học.
                    </div>
                `;
            }
        }

        function populateMajorFilter() {
            const sel = document.getElementById('majorFilterSelect');
            sel.innerHTML = '<option value="ALL">Tất cả chuyên ngành</option>';
            allMajors.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = `${m.majorCode} - ${m.majorName}`;
                sel.appendChild(opt);
            });
        }

        function filterCourses() {
            const q = (document.getElementById('courseSearchInput').value || '').toLowerCase().trim();
            const majorId = document.getElementById('majorFilterSelect').value;

            const filtered = allCourses.filter(c => {
                const matchQuery = !q ||
                    (c.courseName && c.courseName.toLowerCase().includes(q)) ||
                    (c.courseCode && c.courseCode.toLowerCase().includes(q));

                let matchMajor = true;
                if (majorId !== 'ALL') {
                    const mIdNum = Number(majorId);
                    matchMajor = Array.isArray(c.majors) && c.majors.some(m => m.id === mIdNum);
                }
                return matchQuery && matchMajor;
            });

            renderCourses(filtered);
        }

        function renderCourses(courses) {
            const container = document.getElementById('coursesContainer');
            document.getElementById('filteredCoursesCount').textContent = courses.length;

            if (courses.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center bg-white border border-dashed border-slate-300 rounded-2xl">
                        <svg class="w-12 h-12 mx-auto text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                        <h3 class="text-sm font-bold text-slate-700">Chưa tìm thấy khóa học phù hợp</h3>
                        <p class="text-xs text-slate-400 mt-1">Vui lòng điều chỉnh từ khóa tìm kiếm hoặc chọn chuyên ngành khác.</p>
                        <a href="create.html" class="inline-flex items-center px-4 py-2 mt-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold">
                            Tạo khóa học mới
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = courses.map(c => {
                const thumb = c.thumbnailUrl || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500&auto=format&fit=crop&q=80';
                const chaptersCount = c.chapters ? c.chapters.length : 0;
                let totalLessons = 0;
                if (c.chapters) {
                    c.chapters.forEach(ch => { totalLessons += (ch.lessons ? ch.lessons.length : 0); });
                }

                const majorBadges = (c.majors && c.majors.length > 0)
                    ? c.majors.map(m => `<span class="inline-block bg-blue-50 text-blue-700 border border-blue-200 text-[10px] px-2 py-0.5 rounded-md font-semibold">${escapeHtml(m.majorName || m.majorCode)}</span>`).join(' ')
                    : `<span class="text-[10px] text-slate-400 italic">Chung</span>`;

                return `
                    <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between group">
                        <div>
                            <!-- Course Thumbnail & Code Badge -->
                            <div class="relative h-44 overflow-hidden bg-slate-100">
                                <img src="${escapeHtml(thumb)}" alt="${escapeHtml(c.courseName)}"
                                     class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-sm text-white text-[11px] font-mono font-bold px-2.5 py-1 rounded-lg">
                                    ${escapeHtml(c.courseCode)}
                                </div>
                                <div class="absolute top-3 right-3 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-md shadow-sm">
                                    ${c.status === 'PUBLISHED' ? 'Công khai' : 'Bản nháp'}
                                </div>
                            </div>

                            <!-- Course Info -->
                            <div class="p-5">
                                <div class="flex flex-wrap gap-1 mb-2">
                                    ${majorBadges}
                                </div>
                                <h3 class="text-base font-bold text-slate-800 line-clamp-1 group-hover:text-blue-600 transition">
                                    ${escapeHtml(c.courseName)}
                                </h3>
                                <p class="text-xs text-slate-500 line-clamp-2 mt-1.5 leading-relaxed">
                                    ${escapeHtml(c.description || 'Chương trình đào tạo chuyên sâu tích hợp điểm danh nhận diện khuôn mặt.')}
                                </p>

                                <div class="flex items-center space-x-4 text-xs text-slate-500 mt-4 pt-3 border-t border-slate-100">
                                    <div class="flex items-center space-x-1">
                                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                        <span>${chaptersCount} Buổi học</span>
                                    </div>
                                    <div class="flex items-center space-x-1">
                                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                        <span>${totalLessons} Bài giảng</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons: Details, Edit, Delete (No Modal Clutter!) -->
                        <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
                            <a href="details.html?id=${c.id}" class="text-xs font-semibold text-blue-600 hover:text-blue-700 transition flex items-center space-x-1">
                                <span>Chi tiết</span>
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </a>
                            <div class="flex items-center space-x-2">
                                <a href="edit.html?id=${c.id}" class="px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-100 text-slate-700 text-xs font-semibold transition" title="Chỉnh sửa khóa học">
                                    Sửa
                                </a>
                                <a href="delete.html?id=${c.id}" class="px-3 py-1.5 rounded-lg border border-red-200 bg-white hover:bg-red-50 text-red-600 text-xs font-semibold transition" title="Xóa khóa học">
                                    Xóa
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
