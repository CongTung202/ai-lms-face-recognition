server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: lms-backend

  # ----------------------------------------------------------------------------
  # 1. CẤU HÌNH CƠ SỞ DỮ LIỆU MYSQL (RDBMS QUAN HỆ TRUNG TÂM)
  # ----------------------------------------------------------------------------
  datasource:
    url: jdbc:mysql://localhost:3306/lms_online_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ----------------------------------------------------------------------------
  # 2. CẤU HÌNH NOSQL MONGODB (CHO TÀI LIỆU RAG & TELEMETRY VI PHẠM)
  # ----------------------------------------------------------------------------
  data:
    mongodb:
      uri: mongodb://localhost:27017/lms_nosql_db
      auto-index-creation: true

  # ----------------------------------------------------------------------------
  # 3. CẤU HÌNH MULTIPART FILE UPLOAD (CHO VIDEO & TÀI LIỆU LỚN)
  # ----------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      enabled: true

# ------------------------------------------------------------------------------
# 4. CẤU HÌNH BẢO MẬT JWT AUTHENTICATION
# ------------------------------------------------------------------------------
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000 # 24 giờ

# ------------------------------------------------------------------------------
# 5. CẤU HÌNH KẾT NỐI DỊCH VỤ AI FASTAPI (MODULE FACE_AI & RAG)
# ------------------------------------------------------------------------------
ai-service:
  face-api:
    base-url: http://localhost:8001
    enroll-endpoint: /api/v1/face/enroll
    verify-endpoint: /api/v1/face/verify
    head-pose-endpoint: /api/v1/face/head-pose
  rag-api:
    base-url: http://localhost:8001
    query-endpoint: /api/v1/rag/ask

# ------------------------------------------------------------------------------
# 6. ĐƯỜNG DẪN LƯU TRỮ TỆP TIN CỤC BỘ (LOCAL STORAGE)
# ------------------------------------------------------------------------------
storage:
  upload-dir: d:/DATN/uploads
  video-dir: d:/DATN/uploads/videos
  document-dir: d:/DATN/uploads/documents

# ------------------------------------------------------------------------------
# 7. CẤU HÌNH CLOUDINARY (LƯU TRỮ ẢNH KHUÔN MẶT SINH VIÊN QUA CDN)
