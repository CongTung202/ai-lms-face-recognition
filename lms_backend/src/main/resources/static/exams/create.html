<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khởi Tạo Đề Thi Trực Tuyến Mới - LMS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

    <main class="max-w-[1440px] mx-auto px-4 sm:px-7 py-6">
        <div class="max-w-3xl mx-auto bg-slate-900 border border-slate-800 rounded-lg shadow-sm overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-slate-800 flex items-center justify-between gap-3">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-slate-100">Tạo Đề Thi Trực Tuyến &amp; Cấu Hình Giám Sát AI</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Thiết lập thời lượng, số câu hỏi và cơ chế phát hiện gian lận tự động</p>
                </div>
                <a href="list.html" class="inline-flex items-center px-3 py-1.5 rounded text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                    Quay lại danh sách
                </a>
            </div>

            <div class="p-4 sm:p-6">
                <form id="createExamForm" onsubmit="handleFormSubmit(event)">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Mã đề thi</label>
                            <input type="text" id="code" class="form-input" required>
                            <span class="text-[11px] text-slate-400">Ví dụ: EX003, EX_SPRING_FINAL</span>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Khóa học tổ chức thi</label>
                            <select id="courseSelect" class="form-select">
                                <option value="Lập trình Java Nâng cao &amp; Spring Boot 3">Lập trình Java Nâng cao &amp; Spring Boot 3</option>
                                <option value="Trí tuệ Nhân tạo &amp; Thị giác Máy tính (Face AI)">Trí tuệ Nhân tạo &amp; Thị giác Máy tính (Face AI)</option>
                                <option value="Cơ sở Dữ liệu Quan hệ &amp; NoSQL MongoDB">Cơ sở Dữ liệu Quan hệ &amp; NoSQL MongoDB</option>
                            </select>
                        </div>

                        <div class="flex flex-col gap-1.5 md:col-span-2">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Tên kỳ thi / Tiêu đề bài kiểm tra</label>
                            <input type="text" id="title" class="form-input" required>
                            <span class="text-[11px] text-slate-400">Ví dụ: Thi Cuối Kỳ - Lý thuyết &amp; Thực hành Kiến trúc Spring Boot</span>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Thời lượng làm bài (phút)</label>
                            <input type="number" id="duration" class="form-input" min="15" max="180" value="60" required>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Số lượng câu hỏi trắc nghiệm</label>
                            <input type="number" id="questionsCount" class="form-input" min="5" max="100" value="40" required>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Bắt buộc AI giám sát khuôn mặt</label>
                            <select id="requireFace" class="form-select">
                                <option value="true">BẬT (Bắt buộc điểm danh và giám sát 3D Head Pose liên tục)</option>
                                <option value="false">TẮT (Thi tự do không yêu cầu webcam)</option>
                            </select>
                            <span class="text-[11px] text-slate-400">AI phát hiện quay đầu quá 10s hoặc rời khung hình</span>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Trạng thái kỳ thi</label>
                            <select id="status" class="form-select">
                                <option value="OPEN">Đang mở cho sinh viên vào thi</option>
                                <option value="CLOSED">Đóng đề thi (Chưa cho phép)</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-6 pt-5 border-t border-slate-800 flex items-center justify-end gap-3">
                        <a href="list.html" class="inline-flex items-center px-4 py-2 rounded text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                            Hủy bỏ
                        </a>
                        <button type="submit" class="inline-flex items-center px-4 py-2 rounded text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white transition shadow-sm">
                            Lưu và khởi tạo đề thi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../assets/js/store.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderMasterLayout('exams', [
                { label: 'Đề thi & Giám sát AI', url: 'list.html' },
                { label: 'Tạo mới' }
            ]);
        });

        function handleFormSubmit(e) {
            e.preventDefault();
            const store = Store.get();
            const code = document.getElementById("code").value.trim();
            const title = document.getElementById("title").value.trim();
            const course = document.getElementById("courseSelect").value;
            const duration = parseInt(document.getElementById("duration").value, 10) || 45;
            const questionsCount = parseInt(document.getElementById("questionsCount").value, 10) || 30;
            const requireFace = document.getElementById("requireFace").value === "true";
            const status = document.getElementById("status").value;

            const isDuplicate = store.exams.some(x => x.code.toLowerCase() === code.toLowerCase());
            if (isDuplicate) {
                alert("Mã đề thi này đã tồn tại!");
                return;
            }

            const newId = store.exams.length ? Math.max(...store.exams.map(x => x.id)) + 1 : 1;
            store.exams.push({
                id: newId,
                code: code,
                title: title,
                course: course,
                duration: duration,
                questionsCount: questionsCount,
                requireFace: requireFace,
                status: status
            });

            Store.save(store);
            alert("Đã khởi tạo đề thi trực tuyến thành công!");
            window.location.href = "details.html?id=" + newId;
        }
    </script>
</body>
</html>
