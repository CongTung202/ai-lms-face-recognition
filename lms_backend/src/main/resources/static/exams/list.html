<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Đề Thi &amp; Giám Sát AI - LMS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

    <main class="max-w-[1440px] mx-auto px-4 sm:px-7 py-6">
        <div class="bg-slate-900 border border-slate-800 rounded-lg shadow-sm overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-slate-100">Quản Lý Đề Thi Trực Tuyến &amp; Giám Sát AI Proctoring</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Danh mục kỳ thi, yêu cầu kiểm tra danh tính khuôn mặt và theo dõi lịch sử vi phạm</p>
                </div>
                <a href="create.html" class="inline-flex items-center px-3.5 py-1.5 rounded text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white transition">
                    Tạo đề thi mới
                </a>
            </div>

            <div class="p-4 sm:p-5">
                <div class="overflow-x-auto border border-slate-800 rounded-lg">
                    <table class="w-full text-left text-xs sm:text-sm">
                        <thead class="bg-slate-950 text-slate-400 uppercase text-[11px] font-bold border-b border-slate-800">
                            <tr>
                                <th class="p-3 sm:p-3.5 whitespace-nowrap">Mã đề</th>
                                <th class="p-3 sm:p-3.5 whitespace-nowrap">Tên kỳ thi</th>
                                <th class="p-3 sm:p-3.5 whitespace-nowrap">Khóa học đào tạo</th>
                                <th class="p-3 sm:p-3.5 whitespace-nowrap">Thời lượng</th>
                                <th class="p-3 sm:p-3.5 whitespace-nowrap">Yêu cầu AI Face</th>
                                <th class="p-3 sm:p-3.5 whitespace-nowrap">Số câu hỏi</th>
                                <th class="p-3 sm:p-3.5 whitespace-nowrap">Trạng thái</th>
                                <th class="p-3 sm:p-3.5 whitespace-nowrap">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="examTableBody" class="divide-y divide-slate-800/80">
                            <!-- Rendered by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="../assets/js/store.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderMasterLayout('exams', [
                { label: 'Đề thi & Giám sát AI', url: 'list.html' },
                { label: 'Danh sách' }
            ]);
            loadTableData();
        });

        function loadTableData() {
            const store = Store.get();
            const tbody = document.getElementById("examTableBody");
            tbody.innerHTML = "";

            store.exams.forEach(ex => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-800/40 transition-colors";

                const faceBadge = ex.requireFace 
                    ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-950 border border-emerald-700 text-emerald-200">Bắt buộc AI</span>` 
                    : `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-blue-950 border border-blue-700 text-blue-200">Không bắt buộc</span>`;

                const statusBadge = ex.status === "OPEN" 
                    ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-950 border border-emerald-700 text-emerald-200">Đang mở</span>` 
                    : `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-red-950 border border-red-700 text-red-200">Đã đóng</span>`;

                tr.innerHTML = `
                    <td class="p-3 sm:p-3.5"><code class="text-blue-400 bg-slate-950 px-1.5 py-0.5 rounded border border-slate-800">${escapeHtml(ex.code)}</code></td>
                    <td class="p-3 sm:p-3.5 font-semibold text-slate-100">${escapeHtml(ex.title)}</td>
                    <td class="p-3 sm:p-3.5 text-slate-300">${escapeHtml(ex.course)}</td>
                    <td class="p-3 sm:p-3.5 text-slate-300">${ex.duration} phút</td>
                    <td class="p-3 sm:p-3.5">${faceBadge}</td>
                    <td class="p-3 sm:p-3.5 text-slate-300">${ex.questionsCount} câu hỏi</td>
                    <td class="p-3 sm:p-3.5">${statusBadge}</td>
                    <td class="p-3 sm:p-3.5">
                        <div class="flex items-center gap-1.5 whitespace-nowrap">
                            <a href="details.html?id=${ex.id}" class="inline-flex items-center px-2.5 py-1 rounded text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">Chi tiết &amp; Nhật ký</a>
                            <button type="button" class="inline-flex items-center px-2.5 py-1 rounded text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition" onclick="toggleExamStatus(${ex.id})">Đổi trạng thái</button>
                            <button type="button" class="inline-flex items-center px-2.5 py-1 rounded text-xs font-semibold bg-red-900/80 hover:bg-red-800 text-red-100 border border-red-700 transition" onclick="deleteExamRow(${ex.id})">Xóa</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleExamStatus(examId) {
            const store = Store.get();
            const ex = store.exams.find(x => x.id === examId);
            if (!ex) return;

            ex.status = ex.status === 'OPEN' ? 'CLOSED' : 'OPEN';
            Store.save(store);
            showToast("Đã cập nhật trạng thái đề thi!");
            loadTableData();
        }

        function deleteExamRow(examId) {
            const store = Store.get();
            const ex = store.exams.find(x => x.id === examId);
            if (!ex) return;

            if (confirm("Bạn có chắc chắn muốn xóa đề thi " + ex.title + "?")) {
                store.exams = store.exams.filter(x => x.id !== examId);
                Store.save(store);
                showToast("Đã xóa đề thi thành công!");
                loadTableData();
            }
        }
    </script>
</body>
</html>
