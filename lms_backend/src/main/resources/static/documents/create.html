<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nạp Tài Liệu Giáo Trình RAG Mới - LMS Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <main class="layout-container">
        <div class="panel-card" style="max-width: 800px; margin: 0 auto;">
            <div class="panel-header">
                <div>
                    <h2 class="panel-title">Nạp Giáo Trình Mới Vào Kho RAG AI</h2>
                    <p class="panel-description">Bóc tách văn bản, lưu giữ số trang gốc và nạp các đoạn chunks vào MongoDB</p>
                </div>
                <div class="panel-actions">
                    <a href="list.html" class="btn btn-secondary btn-sm">Quay lại danh sách</a>
                </div>
            </div>

            <div class="panel-body">
                <form id="createDocForm" onsubmit="handleFormSubmit(event)">
                    <div class="form-grid">
                        <div class="form-field-group full-width">
                            <label class="form-label">Tên tệp tin giáo trình (File Name)</label>
                            <input type="text" id="fileName" class="form-input" required>
                            <span class="form-hint">Ví dụ: Giao_Trinh_Kien_Truc_Microservices.pdf</span>
                        </div>

                        <div class="form-field-group">
                            <label class="form-label">Khóa học liên kết</label>
                            <select id="courseSelect" class="form-select">
                                <option value="Lập trình Java Nâng cao &amp; Spring Boot 3">Lập trình Java Nâng cao &amp; Spring Boot 3</option>
                                <option value="Trí tuệ Nhân tạo &amp; Thị giác Máy tính (Face AI)">Trí tuệ Nhân tạo &amp; Thị giác Máy tính (Face AI)</option>
                                <option value="Cơ sở Dữ liệu Quan hệ &amp; NoSQL MongoDB">Cơ sở Dữ liệu Quan hệ &amp; NoSQL MongoDB</option>
                            </select>
                            <span class="form-hint">Khoanh vùng phạm vi tìm kiếm của chatbot RAG</span>
                        </div>

                        <div class="form-field-group">
                            <label class="form-label">Định dạng tài liệu</label>
                            <select id="format" class="form-select">
                                <option value="PDF">Tệp PDF (.pdf - Apache PDFBox 3.0)</option>
                                <option value="DOCX">Tệp Word (.docx - Apache POI)</option>
                                <option value="TXT">Tệp văn bản thuần (.txt)</option>
                            </select>
                        </div>

                        <div class="form-field-group">
                            <label class="form-label">Số trang ước tính</label>
                            <input type="number" id="pages" class="form-input" min="1" value="85" required>
                        </div>

                        <div class="form-field-group">
                            <label class="form-label">Kích thước đoạn cắt (Chunk Size)</label>
                            <input type="number" id="chunkSize" class="form-input" value="600" required>
                            <span class="form-hint">Mặc định chuẩn hóa 600 ký tự / chunk</span>
                        </div>

                        <div class="form-field-group full-width">
                            <label class="form-label">Mô tả tóm tắt nội dung giáo trình</label>
                            <textarea id="description" class="form-textarea" rows="3"></textarea>
                        </div>
                    </div>

                    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: flex-end; gap: 10px;">
                        <a href="list.html" class="btn btn-secondary">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary">Xác nhận nạp và cắt đoạn Chunks</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../assets/js/store.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderMasterLayout('documents', [
                { label: 'Tài liệu Giáo trình & RAG', url: 'list.html' },
                { label: 'Nạp mới' }
            ]);
        });

        function handleFormSubmit(e) {
            e.preventDefault();
            const store = Store.get();
            const fileName = document.getElementById("fileName").value.trim();
            const course = document.getElementById("courseSelect").value;
            const format = document.getElementById("format").value;
            const pages = parseInt(document.getElementById("pages").value, 10) || 50;
            const description = document.getElementById("description").value.trim();

            const newId = store.documents.length ? Math.max(...store.documents.map(d => d.id)) + 1 : 1;
            const estimatedChunks = Math.round(pages * 2.3);

            store.documents.push({
                id: newId,
                fileName: fileName,
                course: course,
                format: format,
                pages: pages,
                chunks: estimatedChunks,
                status: "SYNCED",
                description: description || "Tài liệu học tập nạp vào MongoDB RAG."
            });

            Store.save(store);
            alert("Đã bóc tách văn bản và nạp " + estimatedChunks + " đoạn chunks vào MongoDB!");
            window.location.href = "details.html?id=" + newId;
        }
    </script>
</body>
</html>
