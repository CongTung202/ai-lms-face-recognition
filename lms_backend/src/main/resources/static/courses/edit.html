<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh Sửa Khóa Học - LMS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

    <main class="max-w-[1440px] mx-auto px-4 sm:px-7 py-6">
        <div class="max-w-3xl mx-auto bg-slate-900 border border-slate-800 rounded-lg shadow-sm overflow-hidden">
            <div class="p-4 sm:p-5 border-b border-slate-800 flex items-center justify-between gap-3">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-slate-100" id="pageHeading">Chỉnh Sửa Khóa Học</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Cập nhật thông tin học phần, giá bán và cấu hình xuất bản</p>
                </div>
                <a href="list.html" class="inline-flex items-center px-3 py-1.5 rounded text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                    Quay lại danh sách
                </a>
            </div>

            <div class="p-4 sm:p-6">
                <form id="editCourseForm" onsubmit="handleFormSubmit(event)">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Mã khóa học</label>
                            <input type="text" id="code" class="form-input" required>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Môn học trực thuộc</label>
                            <input type="text" id="subject" class="form-input" required>
                        </div>

                        <div class="flex flex-col gap-1.5 md:col-span-2">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Tiêu đề khóa học</label>
                            <input type="text" id="title" class="form-input" required>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Giảng viên phụ trách</label>
                            <input type="text" id="lecturer" class="form-input" required>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Học phí bán qua PayOS (VND)</label>
                            <input type="number" id="price" class="form-input" min="0" step="10000" required>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Trạng thái phát hành</label>
                            <select id="status" class="form-select">
                                <option value="PUBLISHED">Xuất bản công khai</option>
                                <option value="DRAFT">Lưu bản nháp</option>
                            </select>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Số chương mục</label>
                            <input type="number" id="chaptersCount" class="form-input" min="1" max="50">
                        </div>

                        <div class="flex flex-col gap-1.5 md:col-span-2">
                            <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Mô tả tổng quan khóa học</label>
                            <textarea id="description" class="form-textarea" rows="3"></textarea>
                        </div>
                    </div>

                    <div class="mt-6 pt-5 border-t border-slate-800 flex items-center justify-end gap-3">
                        <a href="list.html" class="inline-flex items-center px-4 py-2 rounded text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
                            Hủy bỏ
                        </a>
                        <button type="submit" class="inline-flex items-center px-4 py-2 rounded text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white transition shadow-sm">
                            Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../assets/js/store.js"></script>
    <script>
        let currentCourseId = null;

        document.addEventListener("DOMContentLoaded", () => {
            currentCourseId = parseInt(getQueryParam('id'), 10);
            if (!currentCourseId) {
                alert("Thiếu tham số mã khóa học!");
                window.location.href = "list.html";
                return;
            }

            renderMasterLayout('courses', [
                { label: 'Quản lý Khóa học', url: 'list.html' },
                { label: 'Chỉnh sửa' }
            ]);

            loadCourseData();
        });

        function loadCourseData() {
            const store = Store.get();
            const c = store.courses.find(x => x.id === currentCourseId);
            if (!c) {
                alert("Không tìm thấy khóa học!");
                window.location.href = "list.html";
                return;
            }

            document.getElementById("pageHeading").innerText = "Chỉnh Sửa Khóa Học: " + c.code;
            document.getElementById("code").value = c.code;
            document.getElementById("title").value = c.title;
            document.getElementById("subject").value = c.subject;
            document.getElementById("lecturer").value = c.lecturer;
            document.getElementById("price").value = c.price;
            document.getElementById("status").value = c.status;
            document.getElementById("chaptersCount").value = c.chaptersCount;
            document.getElementById("description").value = c.description || "";
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const store = Store.get();
            const c = store.courses.find(x => x.id === currentCourseId);
            if (!c) return;

            c.code = document.getElementById("code").value.trim();
            c.title = document.getElementById("title").value.trim();
            c.subject = document.getElementById("subject").value.trim();
            c.lecturer = document.getElementById("lecturer").value.trim();
            c.price = parseInt(document.getElementById("price").value, 10) || 0;
            c.status = document.getElementById("status").value;
            c.chaptersCount = parseInt(document.getElementById("chaptersCount").value, 10) || 1;
            c.description = document.getElementById("description").value.trim();

            Store.save(store);
            alert("Đã cập nhật khóa học thành công!");
            window.location.href = "details.html?id=" + currentCourseId;
        }
    </script>
</body>
</html>
